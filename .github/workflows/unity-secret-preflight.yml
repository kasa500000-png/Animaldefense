name: Unity Secret Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - fix/apk-source-repack
    paths:
      - '.github/workflows/unity-secret-preflight.yml'

permissions:
  contents: read

jobs:
  inspect-secrets:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
    steps:
      - name: Safe credential shape check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          lic = os.environ.get('UNITY_LICENSE','')
          email = os.environ.get('UNITY_EMAIL','')
          pwd = os.environ.get('UNITY_PASSWORD','')
          serial = os.environ.get('UNITY_SERIAL','')

          print('UNITY_EMAIL_PRESENT=' + ('yes' if email else 'no'))
          print('UNITY_PASSWORD_PRESENT=' + ('yes' if pwd else 'no'))
          print('UNITY_LICENSE_PRESENT=' + ('yes' if lic else 'no'))
          print('UNITY_SERIAL_PRESENT=' + ('yes' if serial else 'no'))
          print('UNITY_PASSWORD_ALNUM_ONLY=' + ('yes' if pwd and pwd.isalnum() else 'no'))

          if not lic:
              kind='missing'
          elif 'DeveloperData' in lic or '<License' in lic or 'UnityOnlineServices' in lic:
              kind='ulf_like'
          elif 'Entitlement' in lic:
              kind='entitlement_xml_like'
          else:
              kind='unknown'
          print('UNITY_LICENSE_KIND=' + kind)

          if not email or '@' not in email:
              print('::error::UNITY_EMAIL is missing or not email-shaped')
              sys.exit(2)
          if not pwd:
              print('::error::UNITY_PASSWORD is missing')
              sys.exit(3)
          if not lic and not serial:
              print('::error::UNITY_LICENSE/UNITY_SERIAL is missing')
              sys.exit(4)
          if kind == 'entitlement_xml_like' and not serial:
              print('::warning::UNITY_LICENSE looks like UnityEntitlementLicense.xml, not a .ulf file.')
          if pwd and not pwd.isalnum():
              print('::warning::UNITY_PASSWORD contains special characters; GameCI documents activation issues with such passwords.')
          print('SAFE_PREFLIGHT=pass')
          PY
