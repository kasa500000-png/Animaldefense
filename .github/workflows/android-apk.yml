name: Build Android Development APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.ci/source_chunks/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: animaldefense-android-apk
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Unity Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SOURCE_ARCHIVE: .ci/payload/AnimalRandomDefense_v26_2_source.tar.xz
      SOURCE_SHA256: 767ca4faa9cd0005c247fbaeb5a18e73e4b679f123133c2003b4ef79141fc303
      PROJECT: .ci/extracted/AnimalRandomDefense_MVP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify Unity source
        shell: bash
        run: |
          set -euxo pipefail
          test -f .ci/source_chunks/part000.b64
          test -f .ci/source_chunks/part001.b64
          test -f .ci/source_chunks/part002.b64
          test -f .ci/source_chunks/part003.b64
          rm -rf .ci/payload .ci/extracted
          mkdir -p .ci/payload .ci/extracted
          cat .ci/source_chunks/part*.b64 | tr -d '\r\n' | base64 --decode > "$SOURCE_ARCHIVE"
          echo "$SOURCE_SHA256  $SOURCE_ARCHIVE" | sha256sum -c -
          tar -xJf "$SOURCE_ARCHIVE" -C .ci/extracted
          test -f "$PROJECT/ProjectSettings/ProjectVersion.txt"
          test -f "$PROJECT/Packages/manifest.json"
          test -f "$PROJECT/Assets/AnimalRandomDefense/Scripts/Editor/Build/AndroidDevelopmentBuilder.cs"
          grep -q '6000.3.6f1' "$PROJECT/ProjectSettings/ProjectVersion.txt"
          echo "Unity project reconstructed and verified: $PROJECT"

      - name: Preflight Unity credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          if [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; then
            echo "::error::Missing UNITY_EMAIL or UNITY_PASSWORD repository secret."
            echo "::error::GitHub > Settings > Secrets and variables > Actions"
            exit 4
          fi
          if [ -z "${UNITY_LICENSE:-}" ] && [ -z "${UNITY_SERIAL:-}" ]; then
            echo "::error::Missing Unity license secret. Personal: UNITY_LICENSE. Pro: UNITY_SERIAL."
            exit 5
          fi
          echo "Unity credential preflight passed."

      - name: Free disk space for Unity IL2CPP Android build
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: .ci/extracted/AnimalRandomDefense_MVP/Library
          key: ard-v26-android-library-${{ hashFiles('.ci/source_chunks/*.b64') }}
          restore-keys: |
            ard-v26-android-library-

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .ci/extracted/AnimalRandomDefense_MVP
          unityVersion: 6000.3.6f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: AnimalRandomDefense.EditorBuild.AndroidDevelopmentBuilder.Build

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find . -type f -name 'ZodiacRandomDefense-v26-cloud-dev.apk' -print -quit)"
          test -n "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/ZodiacRandomDefense-v26-cloud-dev.apk
          sha256sum apk-output/ZodiacRandomDefense-v26-cloud-dev.apk > apk-output/ZodiacRandomDefense-v26-cloud-dev.apk.sha256
          ls -lh apk-output

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ZodiacRandomDefense-v26-cloud-dev-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 14
