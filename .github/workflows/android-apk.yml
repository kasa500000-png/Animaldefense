name: Build Android Development APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AnimalRandomDefense_v26_2_CLOUD_APK_BUILD.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: animaldefense-android-apk
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Unity Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ARCHIVE: AnimalRandomDefense_v26_2_CLOUD_APK_BUILD.zip
      EXPECTED_SHA256: a69ae77198798496970a3668eaee3f202d86effa1566135e401c6918fc2a8039
      PROJECT: .ci/extracted/AnimalRandomDefense_MVP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — archive and Unity credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Missing $ARCHIVE in repository root. Upload the ZIP from the ChatGPT conversation without renaming it."
            exit 2
          fi

          ACTUAL_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Archive SHA-256 mismatch. Expected $EXPECTED_SHA256, got $ACTUAL_SHA256"
            exit 3
          fi

          if [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; then
            echo "::error::Missing UNITY_EMAIL or UNITY_PASSWORD repository secret."
            exit 4
          fi

          if [ -z "${UNITY_LICENSE:-}" ] && [ -z "${UNITY_SERIAL:-}" ]; then
            echo "::error::Missing Unity license secret. Personal: UNITY_LICENSE. Pro: UNITY_SERIAL."
            exit 5
          fi

          echo "Archive and Unity credential preflight passed."

      - name: Extract Unity project archive
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci/extracted
          mkdir -p .ci/extracted
          unzip -q "$ARCHIVE" -d .ci/extracted
          test -f "$PROJECT/ProjectSettings/ProjectVersion.txt"
          test -f "$PROJECT/Packages/manifest.json"
          test -f "$PROJECT/Assets/AnimalRandomDefense/Scripts/Editor/Build/AndroidDevelopmentBuilder.cs"
          grep -q '6000.3.6f1' "$PROJECT/ProjectSettings/ProjectVersion.txt"
          echo "Unity project extracted: $PROJECT"

      - name: Free disk space for Unity IL2CPP Android build
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: .ci/extracted/AnimalRandomDefense_MVP/Library
          key: ard-v26-android-library-${{ hashFiles('AnimalRandomDefense_v26_2_CLOUD_APK_BUILD.zip') }}
          restore-keys: |
            ard-v26-android-library-

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .ci/extracted/AnimalRandomDefense_MVP
          unityVersion: 6000.3.6f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: AnimalRandomDefense.EditorBuild.AndroidDevelopmentBuilder.Build

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find . -type f -name 'ZodiacRandomDefense-v26-cloud-dev.apk' -print -quit)"
          test -n "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/ZodiacRandomDefense-v26-cloud-dev.apk
          sha256sum apk-output/ZodiacRandomDefense-v26-cloud-dev.apk > apk-output/ZodiacRandomDefense-v26-cloud-dev.apk.sha256
          ls -lh apk-output

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ZodiacRandomDefense-v26-cloud-dev-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 14
