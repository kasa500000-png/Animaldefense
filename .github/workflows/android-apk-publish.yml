name: Build and Publish Android Development APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/apk-source-repack
    paths:
      - '.github/workflows/android-apk-publish.yml'
      - '.ci/ci20/**'
      - '.ci/ci5/**'

permissions:
  contents: write

concurrency:
  group: animaldefense-publish-apk
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Unity Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_ARCHIVE: .ci/payload/AnimalRandomDefense_ci_min.tar.xz
      SOURCE_SHA256: dfad794a8ac75410ed013b007f35fcbb1746de69547cee53a1c2314f0df271b7
      PROJECT: .ci/extracted/AnimalRandomDefense_MVP
      APK_NAME: ZodiacRandomDefense-v26-cloud-dev.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify Unity source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci/payload .ci/extracted
          mkdir -p .ci/payload .ci/extracted

          FILES=(
            .ci/ci20/part000.b64
            .ci/ci20/part001a.b64
            .ci/ci20/part001b.b64
            .ci/ci20/part002.b64
            .ci/ci20/part003.b64
            .ci/ci20/part004.b64
            .ci/ci20/part005a.b64
            .ci/ci20/part005b.b64
            .ci/ci5/part006_00.b64
            .ci/ci5/part006_01.b64
            .ci/ci5/part006_02.b64
            .ci/ci5/part006_03.b64
            .ci/ci5/part007_00.b64
            .ci/ci5/part007_01.b64
            .ci/ci5/part007_02.b64
            .ci/ci5/part007_03.b64
          )
          for f in "${FILES[@]}"; do test -f "$f"; done
          cat "${FILES[@]}" | tr -d '\r\n' > .ci/payload/source.b64
          test "$(wc -c < .ci/payload/source.b64)" -eq 159048
          base64 --decode .ci/payload/source.b64 > "$SOURCE_ARCHIVE"
          echo "$SOURCE_SHA256  $SOURCE_ARCHIVE" | sha256sum -c -
          xz -t "$SOURCE_ARCHIVE"
          tar -xJf "$SOURCE_ARCHIVE" -C .ci/extracted

          test -f "$PROJECT/ProjectSettings/ProjectVersion.txt"
          test -f "$PROJECT/Packages/manifest.json"
          test -f "$PROJECT/Assets/AnimalRandomDefense/Scripts/Editor/Build/AndroidDevelopmentBuilder.cs"
          grep -q '6000.3.6f1' "$PROJECT/ProjectSettings/ProjectVersion.txt"
          echo 'Unity source reconstruction PASS'

      - name: Preflight Unity credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -euo pipefail
          test -n "${UNITY_EMAIL:-}" || { echo '::error::Missing UNITY_EMAIL'; exit 4; }
          test -n "${UNITY_PASSWORD:-}" || { echo '::error::Missing UNITY_PASSWORD'; exit 4; }
          if [ -z "${UNITY_LICENSE:-}" ] && [ -z "${UNITY_SERIAL:-}" ]; then
            echo '::error::Missing UNITY_LICENSE or UNITY_SERIAL'; exit 5
          fi
          echo 'Unity credential preflight passed.'

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: .ci/extracted/AnimalRandomDefense_MVP/Library
          key: ard-v26-android-${{ env.SOURCE_SHA256 }}
          restore-keys: |
            ard-v26-android-

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .ci/extracted/AnimalRandomDefense_MVP
          unityVersion: 6000.3.6f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: AnimalRandomDefense.EditorBuild.AndroidDevelopmentBuilder.Build

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find . -type f -name "$APK_NAME" -print -quit)"
          test -n "$APK"
          mkdir -p apk-output
          cp "$APK" "apk-output/$APK_NAME"
          test "$(head -c 2 "apk-output/$APK_NAME")" = 'PK'
          unzip -t "apk-output/$APK_NAME" >/dev/null
          sha256sum "apk-output/$APK_NAME" | tee "apk-output/$APK_NAME.sha256"
          ls -lh apk-output

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZodiacRandomDefense-v26-cloud-dev-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release delete dev-apk-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          git push origin :refs/tags/dev-apk-latest 2>/dev/null || true
          gh release create dev-apk-latest \
            "apk-output/$APK_NAME" \
            "apk-output/$APK_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Animal Defense v26 Development APK' \
            --notes 'Development APK for Android real-device play testing. ARM64 / IL2CPP / Unity 6000.3.6f1.' \
            --prerelease
